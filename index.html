<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <meta name="description" content="Secure online payment">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <h1>My Website</h1>
        <p>Secure online payments</p>
    </header>

    <main class="container">

        <section class="payment-card">
            <h2>Purchase</h2>

            <p class="description">
                Purchase your product or service securely online.
            </p>

            <div class="price">
                $25.00
            </div>

            <button id="pay-button" class="pay-button">
                Pay $25.00
            </button>

            <p id="payment-message" class="message"></p>

            <p class="secure">
                🔒 Secure payment processing
            </p>
        </section>

    </main>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
